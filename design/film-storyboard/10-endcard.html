<!doctype html>
<html>
<head>
  <title>Waysafe film — frame 10-endcard</title>
  <meta charset="utf-8">
</head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #F7F9FC; }
    a { color: #38BDF8; } a:hover { color: #0EA5E9; }
    .frame { position: relative; width: 1920px; height: 1080px; overflow: hidden;
             font-family: "DM Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
             -webkit-font-smoothing: antialiased; }
    .display { font-family: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif;
               font-variation-settings: "opsz" 96; letter-spacing: -0.03em; line-height: 0.98; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .lb { display: inline-block; width: 150px; }
    .kicker { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
              font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500; }

    /* --- phone shell (390 × 820 screen, no fake status bar) --- */
    .phone { position: relative; width: 410px; height: 840px; border-radius: 58px; background: #020617;
             box-shadow: 0 60px 120px -30px rgba(2,6,23,0.45), 0 0 0 2px #1E293B inset; padding: 10px; }
    .screen { position: relative; width: 390px; height: 820px; border-radius: 48px; background: #FFFFFF; overflow: hidden;
              font-family: "DM Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #07111F; }
    .screen .top { padding: 64px 26px 0 26px; display: flex; justify-content: space-between; align-items: center; }
    .screen .greet { font-size: 15px; color: #64748B; font-weight: 500; }
    .screen .name { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin-top: 2px; }
    .avatar { width: 40px; height: 40px; border-radius: 20px; background: #E2E8F0; display: flex; align-items: center; justify-content: center;
              font-weight: 600; color: #475569; font-size: 15px; }
    .balcard { margin: 26px 22px 0 22px; padding: 22px 22px 20px 22px; border-radius: 22px; background: #07111F; color: #FFFFFF;
               display: flex; flex-direction: column; gap: 6px; }
    .balcard .lbl { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #94A3B8; font-weight: 500; }
    .balcard .amt { font-size: 40px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; margin-top: 8px; }
    .balcard .sub { font-size: 13px; color: #94A3B8; margin-top: 4px; }
    .walletrow { margin: 12px 22px 0 22px; padding: 18px 22px; border-radius: 22px; background: #EEF2F7; display: flex; justify-content: space-between; align-items: center; }
    .walletrow .l { display: flex; flex-direction: column; gap: 3px; }
    .walletrow .t { font-size: 13px; color: #64748B; font-weight: 500; }
    .walletrow .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .section { margin: 26px 26px 0 26px; display: flex; justify-content: space-between; align-items: baseline; }
    .section .h { font-size: 16px; font-weight: 600; }
    .section .s { font-size: 13px; color: #64748B; font-weight: 500; }
    .rows { margin: 8px 12px 0 12px; display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; gap: 14px; padding: 13px 14px; border-radius: 16px; min-height: 60px; }
    .row .ic { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .row .tx { display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0; }
    .row .t1 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .t2 { font-size: 12.5px; color: #64748B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .am { font-size: 15px; font-weight: 600; text-align: right; white-space: nowrap; }
    .row .st { font-size: 11px; font-weight: 600; text-align: right; margin-top: 2px; letter-spacing: 0.02em; }
    .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; padding: 12px 22px 0 22px; border-top: 1px solid #E2E8F0; background: #FFFFFF;
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; color: #94A3B8; }
    .tab.on { color: #07111F; }

    /* --- notifications --- */
    .notif { box-sizing: border-box; width: 372px; padding: 14px 16px 14px 14px; border-radius: 24px; background: rgba(255,255,255,0.92);
             box-shadow: 0 18px 40px -12px rgba(2,6,23,0.35); display: flex; gap: 12px; align-items: flex-start;
             backdrop-filter: blur(20px); }
    .notif .app { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .notif .body { display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0; }
    .notif .meta { display: flex; justify-content: space-between; font-size: 11.5px; color: #64748B; font-weight: 500; letter-spacing: 0.04em; }
    .notif .ttl { font-size: 15px; font-weight: 600; color: #07111F; }
    .notif .msg { font-size: 13.5px; color: #334155; line-height: 1.3; }
</style>
